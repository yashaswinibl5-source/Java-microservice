services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-postgres
    environment:
      POSTGRES_DB: patientservicedb
      POSTGRES_USER: YASHU
      POSTGRES_PASSWORD: YASHU
    ports:
      - "5433:5432"
    volumes:
      - patient_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U YASHU -d patientservicedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  patient-service:
    build:
      context: ./patientservice
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4003:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patientservicedb
      SPRING_DATASOURCE_USERNAME: YASHU
      SPRING_DATASOURCE_PASSWORD: YASHU
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_PORT: 9001
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  billing-service:
    build:
      context: ./billingservice
    container_name: billing-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4002:4001"
      - "9002:9001"
    environment:
      SPRING_APPLICATION_NAME: billingservice
    restart: on-failure

  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4004:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 20
      start_period: 25s
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    restart: unless-stopped

volumes:
  patient_pgdata: